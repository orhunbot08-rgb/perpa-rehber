<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perpa Ürün Arama</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="uygulama/simge-64.png">
<link rel="apple-touch-icon" href="uygulama/simge-180.png">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f4f6;--panel:#fff;--ink:#14161a;--mut:#5f6672;--line:#e1e4ea;--acc:#1f3a5f;--acc2:#2563d6;--accs:rgba(37,99,214,.1);--ok:#0f8a4a;--hit:#e5175b;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--shh:0 8px 24px rgba(16,24,40,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--panel:#1a1d23;--ink:#eceef2;--mut:#9aa2ae;--line:#2b3038;--acc:#9cc0ff;--acc2:#6ea2ff;--accs:rgba(110,162,255,.14);--ok:#3fcf86;--sh:none;--shh:0 8px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#111317;--panel:#1a1d23;--ink:#eceef2;--mut:#9aa2ae;--line:#2b3038;--acc:#9cc0ff;--acc2:#6ea2ff;--accs:rgba(110,162,255,.14);--ok:#3fcf86;--sh:none;--shh:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",Arial,sans-serif}
a{color:var(--acc2)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.ust{max-width:1320px;margin:0 auto;padding:14px 16px 10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:-.3px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.logo span{color:var(--acc2)}
form.ara{flex:1;min-width:260px;display:flex;border:2px solid var(--acc2);border-radius:10px;overflow:hidden;background:var(--panel)}
form.ara input{flex:1;border:0;outline:0;padding:11px 14px;font-size:16px;background:transparent;min-width:0}
form.ara button{border:0;background:var(--acc2);color:#fff;font-weight:700;padding:0 22px}
.ustsag{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:12px}
.ustsag a{font-weight:600;text-decoration:none;white-space:nowrap}
.gecis{border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--ink)!important;background:var(--bg)}
.gecis:hover{border-color:var(--acc2)}
.altnot{max-width:1320px;margin:0 auto;padding:4px 16px 24px;color:var(--mut);font-size:12px}
.cipler{max-width:1320px;margin:0 auto;padding:0 16px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cipler b{font-size:12px;color:var(--mut);font-weight:600;margin-right:2px}
.cip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-size:13px}
.cip:hover{border-color:var(--acc2);color:var(--acc2)}
main{max-width:1320px;margin:0 auto;padding:16px;display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);position:sticky;top:120px;max-height:calc(100vh - 136px);overflow:auto}
.fgrup{padding:12px 14px;border-bottom:1px solid var(--line)}
.fgrup:last-child{border-bottom:0}
.fgrup h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.fsec{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:13px;cursor:pointer;user-select:none}
.fsec input{margin:0;accent-color:var(--acc2)}
.fsec .ad{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsec .say{color:var(--mut);font-size:12px}
.fsec.yok{opacity:.45}
.fara{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);margin-bottom:6px;font-size:12px}
.daha{border:0;background:none;color:var(--acc2);padding:4px 0;font-size:12px;font-weight:600}
.kats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.kats button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 0;font-size:12px}
.kats button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.kats button:disabled{opacity:.35;cursor:default}
.temizle{border:0;background:none;color:var(--hit);font-size:12px;font-weight:600;padding:0}
.sonust{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sonust h1{font-size:18px;margin:0;flex:1;min-width:200px}
.sonust h1 small{font-weight:400;color:var(--mut);font-size:13px;margin-left:6px}
.sonust select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px}
.aktif{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.aktif button{border:1px solid var(--acc2);background:var(--accs);color:var(--acc2);border-radius:999px;padding:2px 10px;font-size:12px}
.grupbilgi{background:var(--accs);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.kart{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s}
.kart:hover{box-shadow:var(--shh);transform:translateY(-2px)}
.resim{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);position:relative}
.resim img{max-width:88%;max-height:88%;object-fit:contain}
.resim .yok{color:#a3a9b3;font-size:12px}
.rozet{position:absolute;left:8px;top:8px;background:var(--acc2);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
.kb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.kad{font-weight:600;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.fiyat{font-size:17px;font-weight:800;color:var(--ok)}
.fiyat.yok{font-size:12px;font-weight:600;color:var(--mut)}
.firma{font-size:12px;color:var(--mut);margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.firma b{color:var(--ink);font-weight:600}
.bos{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:36px;text-align:center;color:var(--mut)}
.bos h2{color:var(--ink);font-size:17px;margin:0 0 6px}
.dahaB{display:block;margin:18px auto 6px;border:1px solid var(--acc2);background:var(--panel);color:var(--acc2);border-radius:10px;padding:10px 26px;font-weight:700}
.karsila{max-width:760px;margin:30px auto;text-align:center}
.karsila h1{font-size:26px;margin:0 0 6px}
.karsila p{color:var(--mut);margin:0 0 18px}
.katlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;text-align:left}
.katlar button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;box-shadow:var(--sh)}
.katlar button:hover{border-color:var(--acc2)}
.katlar span{color:var(--mut);font-size:12px}
/* ürün detayı */
.perde{position:fixed;inset:0;background:rgba(10,12,16,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:20;overflow:auto}
.perde.on{display:flex}
.detay{background:var(--panel);border-radius:14px;max-width:880px;width:100%;box-shadow:var(--shh);overflow:hidden}
.dust{display:grid;grid-template-columns:260px 1fr;gap:20px;padding:20px;border-bottom:1px solid var(--line)}
.dust .resim{border:1px solid var(--line);border-radius:10px}
.dust h2{margin:0 0 8px;font-size:19px;line-height:1.3}
.dust .fiyat{font-size:22px}
.kapat{float:right;border:0;background:none;font-size:22px;line-height:1;color:var(--mut);padding:0 0 0 10px}
.saticilar h3{margin:0;padding:14px 20px 8px;font-size:14px}
.sat{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}
.sat .sf{font-weight:700}
.sat .sk{font-size:12px;color:var(--mut)}
.sat .sp{font-weight:800;color:var(--ok);text-align:right;white-space:nowrap}
.sat .sb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.ana{background:var(--acc2);border-color:var(--acc2);color:#fff}
.mobilF{display:none}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  aside{position:static;max-height:none;display:none}
  aside.ac{display:block}
  .mobilF{display:inline-block;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px}
  .dust{grid-template-columns:1fr}
  .sat{grid-template-columns:1fr auto}
  .sat .sb{grid-column:1/-1;justify-content:flex-start}
  .ust{gap:10px}
}
</style>
</head>

function fiyatOku(s) {
  if (!s) return null;
  const c = /€|eur/i.test(s) ? "€" : /\$|usd/i.test(s) ? "$" : "TL";
  let n = (s.match(/\d[\d.,]*/) || [""])[0];
  if (/,\d{1,2}$/.test(n)) n = n.replace(/\./g, "").replace(",", "."); else if (/\.\d{1,2}$/.test(n) && /,/.test(n)) n = n.replace(/,/g, ""); else n = n.replace(/[.,](?=\d{3}\b)/g, "").replace(",", ".");

const kokler = w => { const k = w.replace(/(lari|leri|lar|ler|si|su|i|u)$/, ""); const S = new Set([w]); if (k.length >= 3) { S.add(k); const z = { g: "k", b: "p", d: "t" }[k.slice(-1)]; if (z) S.add(k.slice(0, -1) + z); } return [...S].map(v => v.replace(/[^a-z0-9]/g, "")); };

const MARKA = new Set("hikvision dahua uniview hilook schneider abb legrand siemens viko makel bosch makita dewalt hilti metabo einhell knipex stanley izeltas cisco ubiquiti tp link mikrotik aruba ruckus panasonic karel fluke".split(" ").concat(["tp link"]));
// aile: aranan şeyin tamamı sözlükteki bir ürün ailesi mi ("vida", "ip kamera") — öyleyse aile ürünleri ("cıvata", "somun") de doğrudan gelir;
// sadece bir kelimesi tutuyorsa ("kamera direği" → kamera) aile ürünleri "benzerlerini de göster" ile açılır
function gruplarOf(qn) {
  const kel = qn.split(" ").filter(w => w.length >= 3);
  const tamT = k => k === qn || (k.length >= 4 && qn.startsWith(k) && !qn.slice(k.length).trim().includes(" ") && kel.length === k.split(" ").length), basT = k => qn.length >= 3 && k.startsWith(qn);
  const gs = f => { const S = UG.map((g, i) => [i, Math.max(0, ...g.k.filter(f).map(k => k.length))]).filter(x => x[1]); const m = Math.max(0, ...S.map(x => x[1])); return S.filter(x => x[1] === m).map(x => x[0]); };
  let g = gs(tamT);
  if (g.length) return { g, aile: !MARKA.has(qn) }; // marka ("hikvision"): sadece o markanın ürünleri, aile "benzerleri"nde
  if (kel.length <= 1) { g = gs(basT); return { g, aile: g.length > 0 }; }
  for (let j = kel.length - 1; j >= 0 && !g.length; j--) { const w = kel[j]; g = gs(k => k === w || (k.length >= 4 && w.startsWith(k))); }
  return { g, aile: false };
}
// her ürün için puan: 3 = aranan kelimeler (ekli hâlleriyle) adında, 2 = aynı ürün ailesinden bir kelime, 1 = kelime başı tutuyor
function ara(q, kategori) {
  const qn = nrm(q), kel = qn.split(" ").filter(w => w.length >= 2), { g, aile } = qn ? gruplarOf(qn) : { g: [], aile: false };
  const tamRe = kel.map(w => new RegExp(" (" + kokler(w).join("|") + ")" + EK + " "));
  const gRe = g.length ? new RegExp(" (" + [...new Set(g.flatMap(i => UG[i].k))].filter(k => k.length >= 3).map(k => k.replace(/[^a-z0-9 ]/g, "")).join("|") + ")" + EK + " ") : null;
  const katRe = kategori != null ? GRE[kategori] : null;
  const son = kel[kel.length - 1], sonRe = son ? new RegExp(" (" + kokler(son).join("|") + ")" + EK + " ") : null;
  const out = [];
  for (const p of P) {
    if (katRe && !katRe.test(p.n)) continue;
    let s = 0;
    if (!qn) s = 2;
    else if (tamRe.every(re => re.test(p.n))) s = 3 + (sonRe && sonRe.test(sonIki(p)) && !/ (dahil|uyumlu|icin|ile) /.test(p.n) ? 0.5 : 0); // ürünün asıl adı sonda: "Matkap Uçlu Vida", "Kamera Direği"
    else if (gRe && gRe.test(p.n)) s = 2;
    else if (kel.every(w => p.n.includes(" " + w))) s = 1;
    if (s) out.push([p, s]);
  }
  // aile ürünleri: aranan şey bir aile değilse ve birebir tutan sonuç varsa ilk anda gizli ("benzerlerini de göster")
  const birebir = out.filter(x => x[1] !== 2).length, benzer = out.length - birebir; // 3 / 3.5 birebir, 2 aile, 1 kelime başı
  const gizle = !aile && birebir > 0 && benzer > 0;
  return { out, g, aile, birebir, benzer, gizle };
}

$("form").onsubmit = e => { e.preventDefault(); yeniArama($("q").value.trim()); };
$("ana").onclick = e => { e.preventDefault(); $("q").value = ""; S.kategori = null; yeniArama(""); };
function yeniArama(q) { S.q = q; $("q").value = q; S.kat.clear(); S.blok.clear(); S.firma.clear(); S.goster = 48; S.firmaHepsi = false; S.firmaAra = ""; if (q) S.kategori = null; hashYaz(); ciz(); window.scrollTo(0, 0); }
window.addEventListener("popstate", () => { hashOku(); ciz(); });

// --- çizim
let SON = null; // son arama (aynı aramada filtre değişince tekrar aranmaz)
function ciz() {
  if (!S.q && S.kategori == null) return karsilama();
  const anahtar = S.q + "|" + S.kategori;
  if (!SON || SON.anahtar !== anahtar) { SON = { anahtar, ...ara(S.q, S.kategori) }; S.genis = false; }
  const { g, gizle, benzer } = SON, out = gizle && !S.genis ? SON.out.filter(x => x[1] !== 2) : SON.out;
  // filtreler: her bölümün sayıları öteki filtreler uygulanmış sonuçtan
  const gecer = (x, haric) => { const p = x[0];
    if (haric !== "kat" && S.kat.size && !S.kat.has(katOf(p.fid))) return false;
    if (haric !== "blok" && S.blok.size && !S.blok.has((V.F[p.fid] || [])[1] || "")) return false;
    if (haric !== "firma" && S.firma.size && !S.firma.has(p.fid)) return false;
    if (haric !== "fiyat" && S.fiyatli && !p.f) return false;
    if (haric !== "resim" && S.resimli && !p.img) return false;
    return true; };
  const say = (haric, f) => { const m = new Map(); for (const x of out) if (gecer(x, haric)) { const k = f(x[0]); if (k) m.set(k, (m.get(k) || 0) + 1); } return m; };
  const R = out.filter(x => gecer(x));
  // aynı ürünü satan firmalar tek kartta (model kodu ya da aynı ad)
  const GR = new Map();
  for (const [p, s] of R) { let o = GR.get(p.anahtar); if (!o) GR.set(p.anahtar, (o = { k: p.anahtar, P: [], s: 0 })); o.P.push(p); o.s = Math.max(o.s, s); }
  const gruplar = [...GR.values()].map(o => {
    const ilk = o.P.find(p => p.img) || o.P[0], fiyatlar = o.P.filter(p => p.f).map(p => p.f);
    const TL = fiyatlar.filter(f => f.c === "TL"), ana = TL.length ? TL : fiyatlar;
    return { ...o, ad: o.P.slice().sort((a, b) => a.ad.length - b.ad.length)[Math.floor((o.P.length - 1) / 2)].ad, img: ilk.img, min: ana.length ? ana.reduce((a, b) => (b.v < a.v ? b : a)) : null, firmaSay: new Set(o.P.map(p => p.fid || "s" + p.sn)).size };
  });
  // uzman firma: bu aramada çok ürünü çıkan firma (cıvatacının vidaları, bilgisayarcının "vida dahil" adaptöründen önce)
  const uzman = new Map(); for (const [p] of R) if (p.fid) uzman.set(p.fid, (uzman.get(p.fid) || 0) + 1);
  gruplar.forEach(o => { o.uz = Math.max(0, ...o.P.map(p => uzman.get(p.fid) || 0)); });
  const kademe = n => (n >= 20 ? 3 : n >= 8 ? 2 : n >= 3 ? 1 : 0);
  const S2 = { alaka: (a, b) => b.s - a.s || kademe(b.uz) - kademe(a.uz) || b.firmaSay - a.firmaSay || !!b.img - !!a.img || !!b.min - !!a.min, artan: (a, b) => !!b.min - !!a.min || (a.min && b.min ? (a.min.c === b.min.c ? a.min.v - b.min.v : a.min.c.localeCompare(b.min.c)) : 0), azalan: (a, b) => !!b.min - !!a.min || (a.min && b.min ? (a.min.c === b.min.c ? b.min.v - a.min.v : a.min.c.localeCompare(b.min.c)) : 0), firma: (a, b) => b.firmaSay - a.firmaSay || b.s - a.s };
  gruplar.sort(S2[S.sira] || S2.alaka);
  filtreCiz(out, say);
  const baslik = S.q ? `“${esc(S.q)}”` : esc(UG[S.kategori].ad);
  const aktif = [...[...S.kat].map(k => [`${k}. kat`, () => S.kat.delete(k)]), ...[...S.blok].map(b => [`${b} Blok`, () => S.blok.delete(b)]), ...[...S.firma].map(f => [(V.F[f] || [f])[0], () => S.firma.delete(f)]),
    ...(S.fiyatli ? [["Fiyatı yazanlar", () => (S.fiyatli = false)]] : []), ...(S.resimli ? [["Resimliler", () => (S.resimli = false)]] : []), ...(S.q && S.kategori != null ? [[UG[S.kategori].ad, () => (S.kategori = null)]] : [])];
  $("sonuc").innerHTML =
    `<div class="sonust"><button class="mobilF" id="mobilF">Filtreler</button><h1>${baslik}<small>${sayi(gruplar.length)} ürün · ${sayi(R.length)} ilan</small></h1>
     <select id="sira"><option value="alaka">Önerilen</option><option value="artan">Fiyat: önce en ucuz</option><option value="azalan">Fiyat: önce en pahalı</option><option value="firma">En çok firmada olan</option></select></div>` +
    (aktif.length ? `<div class="aktif">${aktif.map(([a], i) => `<button data-kaldir="${i}">${esc(a)} ✕</button>`).join("")}</div>` : "") +
    (S.q && g.length ? (gizle ? `<div class="grupbilgi">Adında “${esc(S.q)}” geçen ürünler gösteriliyor. <b>${g.map(i => esc(UG[i].ad)).join(", ")}</b> ailesinden ${sayi(benzer)} ürün daha var: <button class="daha" id="genis">${S.genis ? "Gizle" : "Benzerlerini de göster"}</button></div>`
      : `<div class="grupbilgi">“${esc(S.q)}” için aynı ürün ailesinden de sonuçlar gösteriliyor: <b>${g.map(i => esc(UG[i].ad)).join(", ")}</b></div>`) : "") +
    (gruplar.length ? `<div class="izgara">${gruplar.slice(0, S.goster).map((o, i) => kart(o, i)).join("")}</div>` +
      (gruplar.length > S.goster ? `<button class="dahaB" id="daha">Daha fazla göster (${sayi(gruplar.length - S.goster)} ürün daha)</button>` : "")
      : `<div class="bos"><h2>Sonuç bulunamadı</h2>Başka bir kelimeyle dene ya da filtreleri kaldır. Ürünü sitesinde yazmayan firmalar da olabilir: <a href="Perpa Kat Planı.html">kat planındaki aramada</a> “Firmalar” sekmesine bak.</div>`);
  $("sira").value = S.sira;
  $("sira").onchange = e => { S.sira = e.target.value; ciz(); };
  $("mobilF").onclick = () => $("filtre").classList.toggle("ac");
  $("sonuc").querySelectorAll("[data-kaldir]").forEach(b => b.onclick = () => { aktif[+b.dataset.kaldir][1](); if (S.kategori == null && !S.q) hashYaz(); ciz(); });
  if ($("daha")) $("daha").onclick = () => { S.goster += 96; ciz(); };
  if ($("genis")) $("genis").onclick = () => { S.genis = !S.genis; S.goster = 48; ciz(); };
  $("sonuc").querySelectorAll(".kart").forEach(el => el.onclick = () => detay(gruplar[+el.dataset.i]));
  $("sonuc").querySelectorAll(".resim img").forEach(im => im.addEventListener("error", () => { im.replaceWith(Object.assign(document.createElement("span"), { className: "yok", textContent: "resim yok" })); }));
}
const fiyatYaz = f => f ? `${f.c === "TL" ? "" : f.c + " "}${f.v.toLocaleString("tr-TR", { maximumFractionDigits: 2 })}${f.c === "TL" ? " TL" : ""}` : "";
function kart(o, i) {
  const p = o.P[0], F = V.F[p.fid];
  return `<div class="kart" data-i="${i}"><div class="resim">${o.img ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(o.img)}" alt="">` : `<span class="yok">resim yok</span>`}${o.firmaSay > 1 ? `<span class="rozet">${o.firmaSay} firmada</span>` : ""}</div>
    <div class="kb"><div class="kad" title="${esc(o.ad)}">${esc(o.ad)}</div>
    ${o.min ? `<div class="fiyat">${o.firmaSay > 1 ? `<small style="font-size:12px;font-weight:600;color:var(--mut)">en düşük </small>` : ""}${fiyatYaz(o.min)}</div>` : `<div class="fiyat yok">Fiyat için firmayı ara</div>`}
    <div class="firma">${o.firmaSay > 1 ? `${o.firmaSay} firma · tıkla, karşılaştır` : F ? `<b>${esc(F[0])}</b> · ${esc(yerOf(p.fid))}` : esc(kokOf(p.sn).replace(/^https?:\/\/(www\.)?/, ""))}</div></div></div>`;
}
// --- sol filtreler
function filtreCiz(out, say) {
  const katM = say("kat", p => katOf(p.fid)), blokM = say("blok", p => (V.F[p.fid] || [])[1]), firmaM = say("firma", p => p.fid);
  const kategoriM = new Map(); if (S.q) { const ornek = out.slice(0, 6000); for (const [p] of ornek) GRE.forEach((re, i) => { if (re.test(p.n)) kategoriM.set(i, (kategoriM.get(i) || 0) + 1); }); }
  const fiyatN = out.filter(([p]) => p.f).length, resimN = out.filter(([p]) => p.img).length;
  let firmalar = [...firmaM.entries()].sort((a, b) => b[1] - a[1]);
  if (S.firmaAra) { const fq = nrm(S.firmaAra); firmalar = firmalar.filter(([f]) => nrm((V.F[f] || [""])[0]).includes(fq)); }
  const gorF = S.firmaHepsi || S.firmaAra ? firmalar : firmalar.slice(0, 10);
  const filtreVar = S.kat.size || S.blok.size || S.firma.size || S.fiyatli || S.resimli;
  const kategoriler = [...kategoriM.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10);
  $("filtre").innerHTML =
    (filtreVar ? `<div class="fgrup"><button class="temizle" id="temizle">✕ Filtreleri temizle</button></div>` : "") +
    (kategoriler.length > 1 ? `<div class="fgrup"><h3>Kategori</h3>${kategoriler.map(([i, n]) => `<label class="fsec"><input type="radio" name="kat" data-kategori="${i}" ${S.kategori === i ? "checked" : ""}><span class="ad">${esc(UG[i].ad)}</span><span class="say">${sayi(n)}</span></label>`).join("")}${S.kategori != null ? `<button class="daha" data-kategori="">Tüm kategoriler</button>` : ""}</div>` : "") +
    `<div class="fgrup"><h3>Kat</h3><div class="kats">${Array.from({ length: 13 }, (_, i) => String(i + 1)).map(k => `<button data-kat="${k}" class="${S.kat.has(k) ? "on" : ""}" ${katM.get(k) || S.kat.has(k) ? "" : "disabled"} title="${katM.get(k) || 0} ilan">${k}</button>`).join("")}</div></div>` +
    `<div class="fgrup"><h3>Blok</h3>${["A", "B"].map(b => `<label class="fsec${blokM.get(b) ? "" : " yok"}"><input type="checkbox" data-blok="${b}" ${S.blok.has(b) ? "checked" : ""}><span class="ad">${b} Blok (${b === "A" ? "sağ" : "sol"})</span><span class="say">${sayi(blokM.get(b) || 0)}</span></label>`).join("")}</div>` +
    `<div class="fgrup"><h3>Firma</h3>${firmalar.length > 10 || S.firmaAra ? `<input class="fara" id="firmaAra" placeholder="Firma ara…" value="${esc(S.firmaAra)}">` : ""}
      ${gorF.map(([f, n]) => `<label class="fsec"><input type="checkbox" data-firma="${esc(f)}" ${S.firma.has(f) ? "checked" : ""}><span class="ad" title="${esc((V.F[f] || [f])[0])}">${esc((V.F[f] || [f])[0])}</span><span class="say">${sayi(n)}</span></label>`).join("") || `<span class="fsec yok">Firma yok</span>`}
      ${!S.firmaHepsi && !S.firmaAra && firmalar.length > 10 ? `<button class="daha" id="firmaHepsi">Tümünü göster (${firmalar.length})</button>` : ""}</div>` +
    `<div class="fgrup"><h3>Diğer</h3><label class="fsec${fiyatN ? "" : " yok"}"><input type="checkbox" id="fiyatli" ${S.fiyatli ? "checked" : ""}><span class="ad">Fiyatı yazanlar</span><span class="say">${sayi(fiyatN)}</span></label>
      <label class="fsec"><input type="checkbox" id="resimli" ${S.resimli ? "checked" : ""}><span class="ad">Resimliler</span><span class="say">${sayi(resimN)}</span></label></div>`;
  const F = $("filtre"), yenile = () => { S.goster = 48; ciz(); };
  F.querySelectorAll("[data-kat]").forEach(b => b.onclick = () => { const k = b.dataset.kat; S.kat.has(k) ? S.kat.delete(k) : S.kat.add(k); hashYaz(); yenile(); });
  F.querySelectorAll("[data-blok]").forEach(b => b.onchange = () => { const k = b.dataset.blok; b.checked ? S.blok.add(k) : S.blok.delete(k); yenile(); });
  F.querySelectorAll("[data-firma]").forEach(b => b.onchange = () => { const k = b.dataset.firma; b.checked ? S.firma.add(k) : S.firma.delete(k); yenile(); });
  F.querySelectorAll("[data-kategori]").forEach(b => (b.tagName === "INPUT" ? (b.onchange = () => { S.kategori = +b.dataset.kategori; hashYaz(); yenile(); }) : (b.onclick = () => { S.kategori = null; hashYaz(); yenile(); })));
  if ($("fiyatli")) $("fiyatli").onchange = e => { S.fiyatli = e.target.checked; yenile(); };
  if ($("resimli")) $("resimli").onchange = e => { S.resimli = e.target.checked; yenile(); };
  if ($("firmaHepsi")) $("firmaHepsi").onclick = () => { S.firmaHepsi = true; ciz(); };
  if ($("temizle")) $("temizle").onclick = () => { S.kat.clear(); S.blok.clear(); S.firma.clear(); S.fiyatli = S.resimli = false; hashYaz(); yenile(); };
  const fa = $("firmaAra"); if (fa) { fa.oninput = () => { S.firmaAra = fa.value; ciz(); const y = $("firmaAra"); y.focus(); y.setSelectionRange(y.value.length, y.value.length); }; }
}
// --- ilk ekran: kategoriler
function karsilama() {
  $("filtre").innerHTML = `<div class="fgrup"><h3>Nasıl çalışır</h3><div style="font-size:13px;color:var(--mut)">Perpa firmalarının web sitelerinden toplanan ürünlerde arar. Aynı ürünü satan firmalar tek kartta birleşir; karta tıklayınca firmaları, dükkan yerlerini ve telefonlarını görürsün.</div></div><div class="fgrup" style="font-size:12px;color:var(--mut)">Liste tarihi: ${esc(V.tarih)}</div>`;
  const say = UG.map((g, i) => [i, P.reduce((n, p) => n + (GRE[i].test(p.n) ? 1 : 0), 0)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  $("sonuc").innerHTML = `<div class="karsila"><h1>Perpa'da ne arıyorsun?</h1><p>${sayi(P.length)} ürün, ${sayi(firmaSay)} firmanın sitesinden. Bir ürün yaz ya da kategori seç.</p>
    <div class="katlar">${say.map(([i, n]) => `<button data-kategori="${i}"><b>${esc(UG[i].ad)}</b><span>${sayi(n)}</span></button>`).join("")}</div></div>`;
  $("sonuc").querySelectorAll("[data-kategori]").forEach(b => b.onclick = () => { S.kategori = +b.dataset.kategori; S.q = ""; $("q").value = ""; S.goster = 48; hashYaz(); ciz(); window.scrollTo(0, 0); });
}
// --- ürün detayı: bütün satan firmalar
function detay(o) {
  const P2 = o.P.slice().sort((a, b) => !!b.f - !!a.f || (a.f && b.f ? a.f.v - b.f.v : 0));
  $("detay").innerHTML = `<div class="dust"><div class="resim">${o.img ? `<img referrerpolicy="no-referrer" src="${esc(o.img)}" alt="">` : `<span class="yok">resim yok</span>`}</div>
    <div><button class="kapat" id="kapat" title="Kapat">✕</button><h2>${esc(o.ad)}</h2>
      ${o.min ? `<div class="fiyat">${o.firmaSay > 1 ? "en düşük " : ""}${fiyatYaz(o.min)}</div>` : `<div class="fiyat yok">Sitede fiyat yazmıyor, firmayı arayarak sorabilirsin.</div>`}
      <p style="color:var(--mut);font-size:13px">${o.firmaSay > 1 ? `Bu ürün ${o.firmaSay} firmanın sitesinde var.` : "Bu ürün bir firmanın sitesinde var."} Fiyatlar ve stok firmanın sitesinden; güncelliğini firmaya sorarak doğrula.</p></div></div>
    <div class="saticilar"><h3>Satan firmalar</h3>${P2.map(p => { const F = V.F[p.fid];
      return `<div class="sat"><div><div class="sf">${esc(F ? F[0] : kokOf(p.sn).replace(/^https?:\/\/(www\.)?/, ""))}</div><div class="sk">${F ? `${esc(F[1])} Blok · Dükkan ${esc(F[2])} · ${esc(katOf(p.fid))}. kat` : "Planda yeri yok"}${p.ad !== o.ad ? ` · <i>${esc(p.ad)}</i>` : ""}</div></div>
        <div class="sp">${p.f ? fiyatYaz(p.f) : `<span style="color:var(--mut);font-weight:600;font-size:12px">fiyat yok</span>`}</div>
        <div class="sb">${F && F[5] ? `<a class="btn" href="tel:${esc(String(F[5]).replace(/[^\d+]/g, ""))}">☎ ${esc(F[5])}</a>` : ""}<a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">Sitede aç ↗</a>${F ? `<a class="btn ana" href="Perpa Kat Planı.html#firma=${encodeURIComponent(p.fid)}">Planda göster</a>` : ""}</div></div>`; }).join("")}</div>`;
  $("perde").classList.add("on");
  $("kapat").onclick = kapat;
  $("detay").querySelectorAll("img").forEach(im => im.addEventListener("error", () => im.replaceWith(Object.assign(document.createElement("span"), { className: "yok", textContent: "resim yok" }))));
}
const kapat = () => $("perde").classList.remove("on");
$("perde").onclick = e => { if (e.target === $("perde")) kapat(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") kapat(); });

if (!P.length) { $("sonuc").innerHTML = `<div class="bos"><h2>Ürün listesi bulunamadı</h2>Bu sayfa ile aynı klasörde <b>urunler.js</b> dosyası olmalı.</div>`; return; }
hashOku(); ciz();
// uygulama olarak kurulunca (internet adresinden açıldıysa) sayfalar telefona kaydedilir, internetsiz de açılır
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
